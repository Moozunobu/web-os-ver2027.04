name = "wetalks-backend"
main = "worker.js"
compatibility_date = "2024-09-01"

# =========================================================================
# Primary Database: Turso (libSQL)
# Cloudflare D1 の無料枠読み取り制限を回避するため、Turso をメインDBとして使用します。
# Worker の環境変数/シークレットとして設定してください:
#   npx wrangler secret put TURSO_DATABASE_URL
#   npx wrangler secret put TURSO_AUTH_TOKEN
# =========================================================================

# (Optional) Legacy Cloudflare D1 binding — D1 からのデータ移行時のみ残しておけます
# [[d1_databases]]
# binding = "DB"
# database_name = "wetalks-db"
# database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"

# (Optional) Legacy Cloudflare KV binding
# [[kv_namespaces]]
# binding = "WETALKS_KV"
# id = "YOUR_KV_NAMESPACE_ID"
